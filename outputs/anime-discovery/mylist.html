<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的追番 · 番组发现 AnimeDiscovery</title>
<meta name="description" content="本地追番管理：收藏列表、观看进度、最近浏览，全部保存在浏览器本地。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌸</text></svg>">
</head>
<body data-page="mylist">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">◈</span>番组发现
      <span class="brand-sub">Anime Discovery</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html" data-nav="home">首页</a>
      <a href="mylist.html" data-nav="mylist">我的追番<span class="mylist-badge" data-fav-count style="display:none">0</span></a>
      <a href="about.html" data-nav="about">关于</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">My List</p>
  <h1>我的追番</h1>
  <p class="muted" style="max-width:70ch">
    收藏与观看进度保存在浏览器的 localStorage 中，只属于这台设备的这个浏览器，不会上传。
    清除浏览器数据会一并清空。
  </p>

  <p id="storageNotice" class="notice" hidden style="margin-top:16px"></p>

  <div class="stat-row">
    <div class="stat"><strong id="statFav">0</strong><span>收藏番剧</span></div>
    <div class="stat"><strong id="statTracking">0</strong><span>有进度记录</span></div>
    <div class="stat"><strong id="statEpisodes">0</strong><span>累计标记集数</span></div>
  </div>

  <section id="continueSection" hidden>
    <div class="section-head">
      <div>
        <h2>继续观看</h2>
        <p class="faint">最近有更新进度的番剧</p>
      </div>
    </div>
    <div class="mylist-grid" id="continueGrid"></div>
  </section>

  <div class="section-head">
    <div>
      <h2>收藏列表</h2>
      <p class="faint">点击卡片进入详情页勾选集数，进度会显示在这里</p>
    </div>
    <div class="chips">
      <button class="btn btn-sm" id="exportBtn" type="button">导出记录</button>
      <button class="btn btn-sm btn-danger" id="clearAllBtn" type="button">清空全部数据</button>
    </div>
  </div>
  <div class="poster-grid" id="favoriteGrid"></div>

  <section id="recentSection" hidden>
    <div class="section-head">
      <div>
        <h2>最近浏览</h2>
        <p class="faint">最多保留 8 条</p>
      </div>
    </div>
    <div class="mylist-grid" id="recentGrid"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>© <span data-year>2026</span> 番组发现 · 仅作信息展示与个人追番记录的演示站点</span>
    <span><a href="about.html">免责声明</a> · <a href="index.html">首页</a></span>
  </div>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/mylist.js"></script>
</body>
</html>
